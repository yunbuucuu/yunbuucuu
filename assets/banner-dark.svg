<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Just code it. - yunbuucuu Monochrome Sketch Banner (Dark)">
  <defs>
    <!-- Concrete charcoal gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>

    <!-- Subtle monochrome concrete noise texture -->
    <filter id="grain-dark" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
      <feBlend mode="screen" in="softNoise" in2="SourceGraphic"/>
    </filter>

    <!-- Rough hand-drawn ink edge displacement -->
    <filter id="sketch-edge" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <clipPath id="clip-dark">
      <rect x="2" y="2" width="1196" height="316" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .hero-title {
      font-family: 'Segoe UI', 'Arial Black', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }
    .hero-sub {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .doodle-txt {
      font-family: 'Comic Sans MS', 'Segoe Print', 'Chalkboard SE', Consolas, monospace;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <g clip-path="url(#clip-dark)">
    <!-- Textured charcoal concrete base -->
    <rect width="1200" height="320" fill="url(#bg-dark)" filter="url(#grain-dark)"/>

    <!-- Background chalk graffiti scribbles (developer / ML themed) -->
    <g opacity="0.16" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left wall chalk marks -->
      <text x="34" y="54" class="doodle-txt" font-size="22" transform="rotate(-7 34 54)">0xFF</text>
      <text x="118" y="38" class="doodle-txt" font-size="14" transform="rotate(5 118 38)">def meta():</text>
      <text x="48" y="294" class="doodle-txt" font-size="18" transform="rotate(-4 48 294)">∇L(θ) → min</text>
      <text x="275" y="48" class="doodle-txt" font-size="16" transform="rotate(6 275 48)">TORCH.NN</text>
      <text x="420" y="292" class="doodle-txt" font-size="20" transform="rotate(-6 420 292)">/// CODE</text>
      <text x="595" y="44" class="doodle-txt" font-size="17" transform="rotate(4 595 44)">{ META }</text>
      <text x="640" y="296" class="doodle-txt" font-size="15" transform="rotate(-3 640 296)">import torch</text>
      <text x="720" y="76" class="doodle-txt" font-size="21" transform="rotate(-9 720 76)">λ = 0.01</text>
      <text x="1088" y="54" class="doodle-txt" font-size="20" transform="rotate(8 1088 54)">#PY</text>
      <text x="1062" y="294" class="doodle-txt" font-size="18" transform="rotate(-5 1062 294)">EOF //</text>

      <!-- Sketchy crosshatch, arrows, stars, circles -->
      <path d="M 24 110 L 66 94 M 30 122 L 72 106 M 38 134 L 62 124" stroke-width="2"/>
      <path d="M 215 270 L 258 264 L 242 284 L 288 274" stroke-width="1.8"/>
      <path d="M 520 26 L 545 48 M 546 28 L 518 46" stroke-width="2.2"/>
      <circle cx="718" cy="248" r="22" stroke-width="1.6" stroke-dasharray="14 4 8 3"/>
      <path d="M 708 240 L 728 256 M 727 240 L 709 257" stroke-width="1.8"/>
      <path d="M 1110 112 L 1168 96 M 1122 126 L 1176 112 M 1136 142 L 1166 134" stroke-width="2.2"/>
      <path d="M 1098 188 L 1130 220 M 1132 186 L 1096 218 M 1114 176 L 1114 228" stroke-width="2"/>
      <path d="M 18 220 Q 52 198 84 226 T 142 214" stroke-width="1.6"/>
      <path d="M 358 34 Q 382 18 402 42" stroke-width="1.6"/>
      <path d="M 762 126 L 796 112 L 784 134 L 814 124" stroke-width="1.6"/>
      <!-- Tiny scribble burst -->
      <path d="M 605 256 L 622 246 L 614 266 L 634 256 L 626 274" stroke-width="1.6"/>
    </g>

    <!-- ===== Deadpan Sketch Cat Silhouette (Right Side, Matching Reference Image) ===== -->
    <g transform="translate(768, 22)">
      <!-- Energetic messy white chalk outer scratch strokes -->
      <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
        <!-- Outer rough halo stroke 1 -->
        <path d="M 92 298 L 104 248 L 62 222 C 34 196, 30 142, 46 86 L 64 16 L 116 96 L 154 96 L 204 18 L 222 88 C 238 144, 232 198, 204 224 L 166 248 L 180 298"
              stroke-width="4.2" opacity="0.95" filter="url(#sketch-edge)"/>
        <!-- Outer rough halo stroke 2 (offset sketchy double line) -->
        <path d="M 86 298 L 99 245 L 55 216 C 28 188, 25 138, 41 80 L 60 8 L 112 90 L 159 90 L 209 10 L 228 82 C 244 140, 238 194, 209 220 L 172 245 L 186 298"
              stroke-width="2.1" opacity="0.82"/>
        <!-- Extra sketchy scratch ticks around ears & head -->
        <path d="M 56 26 L 66 2 L 82 36 M 196 34 L 211 4 L 220 34" stroke-width="2" opacity="0.85"/>
        <path d="M 38 118 L 28 148 M 34 140 L 26 172 M 234 114 L 244 146 M 238 142 L 246 174" stroke-width="1.8" opacity="0.75"/>
        <path d="M 106 88 L 164 86 M 110 95 L 158 93" stroke-width="2.2" opacity="0.88"/>
        <!-- Sketchy left whiskers -->
        <path d="M 52 184 L -10 174 M 50 190 L -18 184 M 54 198 L -8 196 M 56 205 L -14 212 M 62 212 L 0 222" stroke-width="2.3" opacity="0.92"/>
        <!-- Sketchy right whiskers -->
        <path d="M 218 184 L 280 174 M 220 190 L 288 184 M 216 198 L 278 196 M 214 205 L 284 212 M 208 212 L 270 222" stroke-width="2.3" opacity="0.92"/>
        <!-- Shoulder scratch lines -->
        <path d="M 96 248 L 80 298 M 106 254 L 94 298 M 164 252 L 176 298 M 174 246 L 190 298" stroke-width="1.8" opacity="0.8"/>
      </g>

      <!-- Solid Pitch-Black Cat Body & Head Silhouette -->
      <path d="M 94 300 L 106 246 L 64 222 C 36 196, 32 142, 48 88 L 66 22 L 116 98 L 154 98 L 202 24 L 220 90 C 236 144, 230 198, 202 224 L 164 246 L 178 300 Z"
            fill="#050505"/>

      <!-- Iconic Half-Lidded Deadpan White Eyes -->
      <!-- Left eye (flat top lid, rounded bottom) -->
      <path d="M 74 156 L 122 153 C 124 176, 114 186, 98 186 C 82 186, 73 176, 74 156 Z" fill="#FFFFFF"/>
      <!-- Left pupil -->
      <path d="M 105 154 L 115 153.5 L 115 170 C 115 174, 112 177, 109.5 177 C 107 177, 105 174, 105 170 Z" fill="#050505"/>

      <!-- Right eye (flat top lid, rounded bottom) -->
      <path d="M 148 153 L 196 151 C 198 174, 188 184, 172 184 C 156 184, 147 174, 148 153 Z" fill="#FFFFFF"/>
      <!-- Right pupil -->
      <path d="M 178 152 L 188 151.5 L 188 168 C 188 172, 185 175, 182.5 175 C 180 175, 178 172, 178 168 Z" fill="#050505"/>

      <!-- Tiny minimalist white nose -->
      <ellipse cx="136" cy="187" rx="5.5" ry="2.6" fill="#FFFFFF"/>
    </g>

    <!-- ===== Left Side Typography & Zine Tags ===== -->
    <!-- Top-left raw chalk tag -->
    <g transform="translate(56, 46)">
      <rect x="4" y="4" width="296" height="30" rx="2" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.45"/>
      <rect x="0" y="0" width="296" height="30" rx="2" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.6"/>
      <circle cx="18" cy="15" r="4" fill="#FFFFFF"/>
      <text x="32" y="19.5" class="mono" fill="#FFFFFF">@yunbuucuu // OPEN TO WORK</text>
    </g>

    <!-- Hero Title with stark monochrome offset shadow -->
    <text x="60" y="166" class="hero-title" fill="#000000" opacity="0.85">Just code it.</text>
    <text x="56" y="162" class="hero-title" fill="#FFFFFF">Just code it.</text>

    <!-- Sketchy double underline under title -->
    <path d="M 56 184 L 448 180 M 62 190 L 418 188" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

    <!-- Chinese Subtitle -->
    <text x="58" y="232" class="hero-sub" fill="#E5E5E5">研三学生 · 元学习（Meta-Learning）方向 · 正在寻找工作机会</text>

    <!-- Bottom-left minimalist monochrome metadata strip -->
    <g transform="translate(58, 260)">
      <rect x="0" y="0" width="76" height="22" rx="2" fill="#FFFFFF"/>
      <text x="38" y="15" text-anchor="middle" class="mono" fill="#0A0A0A" font-size="11">PYTHON</text>
      <rect x="86" y="0" width="84" height="22" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="128" y="15" text-anchor="middle" class="mono" fill="#FFFFFF" font-size="11">PYTORCH</text>
      <rect x="180" y="0" width="132" height="22" rx="2" fill="none" stroke="#A3A3A3" stroke-width="1.2" stroke-dasharray="6 3"/>
      <text x="246" y="15" text-anchor="middle" class="mono" fill="#D4D4D4" font-size="11">META-LEARNING</text>
    </g>
  </g>

  <!-- Double sketchy monochrome outer frame -->
  <rect x="2" y="2" width="1196" height="316" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.82"/>
  <rect x="7" y="7" width="1186" height="306" rx="5" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.28" stroke-dasharray="18 6 40 8"/>
</svg>
