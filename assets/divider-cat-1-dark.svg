<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Sketch black cat batting a yarn ball divider 1 (Dark)">
  <defs>
    <filter id="sketch-d1" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ===== Sketchy Yarn Thread unspooling Right -> Left ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Secondary faint chalk sketch line -->
    <path d="M 1054 83 C 960 72, 875 94, 770 81 C 655 68, 550 93, 430 80 C 315 68, 220 92, 108 78"
          stroke="#A3A3A3" stroke-width="1.3" stroke-dasharray="14 6 24 5" opacity="0.65"/>
    <!-- Primary crisp chalk yarn line -->
    <path d="M 1056 80 C 962 68, 878 92, 772 78 C 656 64, 552 90, 432 77 C 316 64, 222 88, 106 76"
          stroke="#F5F5F5" stroke-width="2.4" filter="url(#sketch-d1)"/>
    <!-- Playful yarn curl loop in mid-left -->
    <path d="M 358 74 C 344 56, 372 52, 368 72" stroke="#F5F5F5" stroke-width="2.1"/>
    <!-- Swat action ticks near cat paw -->
    <path d="M 1038 66 L 1024 62 M 1040 74 L 1026 76 M 1044 58 L 1034 50" stroke="#FFFFFF" stroke-width="1.7" opacity="0.85"/>
    <!-- Rolling speed arcs behind yarn ball -->
    <path d="M 134 62 Q 152 66 164 60 M 138 72 Q 158 75 174 71 M 132 84 Q 148 86 160 82"
          stroke="#D4D4D4" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- ===== Hand-Drawn Textured Yarn Ball (Left End) ===== -->
  <g transform="translate(82, 72)">
    <!-- Loose trailing yarn tail on far left -->
    <path d="M -26 6 Q -42 12 -52 4" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
    <!-- Outer sketchy chalk ring -->
    <circle cx="0" cy="0" r="24" fill="#141414" stroke="#FFFFFF" stroke-width="2.4" filter="url(#sketch-d1)"/>
    <circle cx="1" cy="-1" r="25.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55" stroke-dasharray="16 6 10 5"/>
    <!-- Crisscross wound yarn strands inside ball -->
    <g fill="none" stroke="#F5F5F5" stroke-width="1.7" stroke-linecap="round" opacity="0.92">
      <path d="M -18 -10 C -6 -20, 12 -16, 20 -4"/>
      <path d="M -22 2 C -8 -10, 10 -6, 22 6"/>
      <path d="M -16 14 C -2 4, 12 8, 18 14"/>
      <path d="M -12 -19 C -2 -6, -8 10, -14 18"/>
      <path d="M 4 -22 C 12 -8, 6 10, -2 22"/>
      <path d="M 16 -14 C 18 -2, 14 10, 8 20"/>
    </g>
    <!-- Little rolling rotation arrow above ball -->
    <path d="M -14 -31 Q 0 -39 14 -30" fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -14 -31 L -9 -35 M -14 -31 L -8 -27" fill="none" stroke="#D4D4D4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ===== Pose 1: Sitting Deadpan Black Cat Batting Yarn (Right End) ===== -->
  <g transform="translate(1058, 8)">
    <!-- Messy chalk white sketchy outer outline -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tail curled behind right -->
      <path d="M 102 82 C 126 78, 134 52, 120 34 C 114 26, 106 30, 108 38" stroke-width="5.5" stroke="#050505"/>
      <path d="M 102 82 C 126 78, 134 52, 120 34 C 114 26, 106 30, 108 38" stroke-width="2.2" stroke="#FFFFFF"/>
      <!-- Rough white outline around body & ears -->
      <path d="M 28 88 L 10 80 C 2 76, 4 68, 14 70 L 38 74 L 40 48 C 36 38, 36 26, 42 16 L 48 4 L 62 20 L 76 20 L 88 4 L 94 18 C 102 28, 102 44, 96 54 C 106 66, 106 82, 100 88 Z"
            stroke-width="3.6" opacity="0.95" filter="url(#sketch-d1)"/>
      <path d="M 26 90 L 6 81 C -1 76, 2 65, 13 68 L 36 72 L 38 46 C 34 36, 34 24, 40 14 L 47 0 L 62 17 L 77 17 L 90 1 L 96 16 C 105 27, 105 44, 99 54 C 109 66, 109 84, 102 90"
            stroke-width="1.4" opacity="0.72"/>
      <!-- Sketchy whiskers -->
      <path d="M 38 40 L 18 36 M 38 44 L 16 44 M 39 48 L 20 52" stroke-width="1.6" opacity="0.9"/>
      <path d="M 96 40 L 114 36 M 96 44 L 116 44" stroke-width="1.5" opacity="0.85"/>
    </g>

    <!-- Solid Pitch-Black Cat Silhouette -->
    <path d="M 28 88 L 10 80 C 2 76, 4 68, 14 70 L 38 74 L 40 48 C 36 38, 36 26, 42 16 L 48 4 L 62 20 L 76 20 L 88 4 L 94 18 C 102 28, 102 44, 96 54 C 106 66, 106 82, 100 88 Z"
          fill="#050505"/>

    <!-- Iconic Half-Lidded Deadpan White Eyes (looking left at yarn) -->
    <path d="M 45 35 L 61 34 C 61 42, 57 45, 53 45 C 48 45, 45 42, 45 35 Z" fill="#FFFFFF"/>
    <path d="M 47 35 L 52 34.8 L 52 41 C 52 42.5, 50.8 43.5, 49.5 43.5 C 48.2 43.5, 47 42.5, 47 41 Z" fill="#050505"/>

    <path d="M 69 34 L 85 35 C 85 42, 81 45, 77 45 C 72 45, 69 42, 69 34 Z" fill="#FFFFFF"/>
    <path d="M 71 34.5 L 76 34.7 L 76 41 C 76 42.5, 74.8 43.5, 73.5 43.5 C 72.2 43.5, 71 42.5, 71 41 Z" fill="#050505"/>

    <!-- Tiny white nose -->
    <ellipse cx="64" cy="46" rx="2.2" ry="1.1" fill="#FFFFFF"/>
  </g>
</svg>
