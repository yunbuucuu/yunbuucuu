<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Sketch black cat pouncing toward a rolling yarn ball divider 2 (Dark)">
  <defs>
    <filter id="sketch-d2" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="23" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ===== Bouncy Loop-de-Loop Sketchy Yarn Trail Right -> Left ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1030 84 C 950 92, 892 60, 810 78 C 726 95, 656 54, 578 78 C 492 102, 405 64, 315 80 C 235 94, 175 64, 118 76"
          stroke="#A3A3A3" stroke-width="1.3" stroke-dasharray="12 6 20 5" opacity="0.65"/>
    <path d="M 1032 82 C 952 90, 894 56, 812 75 C 728 92, 658 50, 580 75 C 494 98, 406 60, 316 77 C 236 90, 176 62, 116 74"
          stroke="#F5F5F5" stroke-width="2.4" filter="url(#sketch-d2)"/>
    <!-- Two playful vertical yarn curlicues -->
    <path d="M 744 74 C 730 50, 762 46, 756 72" stroke="#F5F5F5" stroke-width="2"/>
    <path d="M 278 76 C 266 56, 294 54, 288 75" stroke="#F5F5F5" stroke-width="2"/>
    <!-- Energy lines behind pouncing cat -->
    <path d="M 1176 42 L 1192 36 M 1178 52 L 1194 50 M 1174 62 L 1188 66" stroke="#D4D4D4" stroke-width="1.6" opacity="0.8"/>
    <!-- Bounce speed arcs behind yarn ball -->
    <path d="M 142 54 Q 162 48 180 56 M 148 64 Q 166 60 182 66" stroke="#D4D4D4" stroke-width="1.6" opacity="0.82"/>
  </g>

  <!-- ===== Hand-Drawn Textured Yarn Ball (Left, Mid-Bounce!) ===== -->
  <g transform="translate(92, 64)">
    <path d="M -25 10 Q -40 20 -54 14" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
    <!-- Subtle ground shadow sketch underneath bouncing ball -->
    <path d="M -16 32 L 16 32 M -10 36 L 10 36" stroke="#737373" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    <circle cx="0" cy="0" r="23" fill="#141414" stroke="#FFFFFF" stroke-width="2.4" filter="url(#sketch-d2)"/>
    <circle cx="-1" cy="1" r="24.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55" stroke-dasharray="14 5 12 6"/>
    <g fill="none" stroke="#F5F5F5" stroke-width="1.7" stroke-linecap="round" opacity="0.92">
      <path d="M -18 -8 C -4 -18, 12 -14, 19 -2"/>
      <path d="M -21 4 C -6 -8, 10 -4, 21 8"/>
      <path d="M -14 15 C -2 6, 10 10, 16 14"/>
      <path d="M -10 -18 C -2 -4, -8 10, -14 16"/>
      <path d="M 5 -21 C 12 -6, 6 10, -2 21"/>
    </g>
  </g>

  <!-- ===== Pose 2: Playful Arched-Back Pouncing Black Cat (Right End) ===== -->
  <g transform="translate(1022, 10)">
    <!-- High S-curved tail -->
    <path d="M 122 52 C 138 38, 144 16, 130 8 C 122 4, 116 12, 122 18" fill="none" stroke="#050505" stroke-width="6" stroke-linecap="round"/>
    <path d="M 122 52 C 138 38, 144 16, 130 8 C 122 4, 116 12, 122 18" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Messy white chalk double outline -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 84 C 6 80, 8 72, 18 72 L 42 74 L 44 64 C 34 62, 28 52, 32 40 L 34 26 L 46 38 L 58 38 L 68 24 L 72 38 C 84 36, 104 32, 120 46 C 130 56, 132 72, 128 86 L 116 86 L 114 68 C 96 64, 78 68, 66 76 L 56 86 L 42 86 L 44 82 Z"
            stroke-width="3.6" opacity="0.95" filter="url(#sketch-d2)"/>
      <path d="M 8 86 C 2 80, 5 69, 17 69 L 40 71 L 41 62 C 30 60, 25 49, 29 37 L 32 21 L 46 35 L 58 35 L 69 20 L 74 35 C 87 32, 107 29, 124 44 C 134 55, 136 72, 131 88"
            stroke-width="1.4" opacity="0.72"/>
      <!-- Whiskers -->
      <path d="M 30 52 L 10 48 M 30 56 L 8 56 M 32 60 L 14 63" stroke-width="1.6" opacity="0.9"/>
    </g>

    <!-- Solid Pitch-Black Pouncing Cat Silhouette -->
    <path d="M 12 84 C 6 80, 8 72, 18 72 L 42 74 L 44 64 C 34 62, 28 52, 32 40 L 34 26 L 46 38 L 58 38 L 68 24 L 72 38 C 84 36, 104 32, 120 46 C 130 56, 132 72, 128 86 L 116 86 L 114 68 C 96 64, 78 68, 66 76 L 56 86 L 42 86 L 44 82 Z"
          fill="#050505"/>

    <!-- Iconic Half-Lidded Deadpan White Eyes (locked onto left yarn ball) -->
    <path d="M 35 48 L 49 47 C 49 54, 46 57, 42 57 C 38 57, 35 54, 35 48 Z" fill="#FFFFFF"/>
    <path d="M 36.5 48 L 41 47.8 L 41 53.5 C 41 55, 39.8 55.8, 38.8 55.8 C 37.6 55.8, 36.5 55, 36.5 53.5 Z" fill="#050505"/>

    <path d="M 55 47 L 69 48 C 69 54, 66 57, 62 57 C 58 57, 55 54, 55 47 Z" fill="#FFFFFF"/>
    <path d="M 56.5 47.5 L 61 47.8 L 61 53.5 C 61 55, 59.8 55.8, 58.8 55.8 C 57.6 55.8, 56.5 55, 56.5 53.5 Z" fill="#050505"/>

    <ellipse cx="51" cy="58" rx="2" ry="1" fill="#FFFFFF"/>
  </g>
</svg>
