<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="code is everything - yunbuucuu GitHub Profile Banner (Nord Light)">
  <defs>
    <!-- Nord Snow Storm background gradient -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF4"/>
      <stop offset="55%" stop-color="#E8EDF4"/>
      <stop offset="100%" stop-color="#E5E9F0"/>
    </linearGradient>

    <!-- Minimalist Nord Snow Storm coordinate grid -->
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5E81AC" stroke-width="0.7" stroke-opacity="0.16"/>
    </pattern>

    <radialGradient id="grid-fade-light" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask-light">
      <rect width="1200" height="300" fill="url(#grid-fade-light)"/>
    </mask>

    <!-- Frost & Glacial Aurora wave gradients (Light edition) -->
    <linearGradient id="aurora-1-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81A1C1" stop-opacity="0.06"/>
      <stop offset="28%" stop-color="#88C0D0" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#8FBCBB" stop-opacity="0.26"/>
      <stop offset="82%" stop-color="#B48EAD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5E81AC" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="aurora-2-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E81AC" stop-opacity="0.05"/>
      <stop offset="35%" stop-color="#81A1C1" stop-opacity="0.24"/>
      <stop offset="68%" stop-color="#5E81AC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#88C0D0" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="aurora-stroke-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E81AC" stop-opacity="0"/>
      <stop offset="25%" stop-color="#5E81AC" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#81A1C1" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#8FBCBB" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5E81AC" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="title-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E3440"/>
      <stop offset="55%" stop-color="#3B4252"/>
      <stop offset="100%" stop-color="#5E81AC"/>
    </linearGradient>

    <filter id="glow-light" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="card-clip-light">
      <rect x="1" y="1" width="1198" height="298" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 2.5px;
    }
    .subtitle {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 1.4px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.6px;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .dot-pulse {
      animation: pulseDot 2.8s ease-in-out infinite;
    }
  </style>

  <g clip-path="url(#card-clip-light)">
    <!-- Base surface -->
    <rect width="1200" height="300" fill="url(#bg-light)"/>

    <!-- Minimalist coordinate grid -->
    <rect width="1200" height="300" fill="url(#grid-light)" mask="url(#grid-mask-light)"/>

    <!-- Ambient frost mist -->
    <ellipse cx="320" cy="70" rx="280" ry="110" fill="#88C0D0" opacity="0.16" filter="url(#glow-light)"/>
    <ellipse cx="890" cy="235" rx="300" ry="115" fill="#81A1C1" opacity="0.14" filter="url(#glow-light)"/>

    <!-- Aurora Wave Layer 1 -->
    <path d="M -20 225 C 210 140, 420 275, 650 185 C 860 105, 1020 220, 1220 155 L 1220 310 L -20 310 Z"
          fill="url(#aurora-1-light)"/>

    <!-- Aurora Wave Layer 2 -->
    <path d="M -20 250 C 260 180, 490 285, 760 205 C 950 148, 1070 245, 1220 205 L 1220 310 L -20 310 Z"
          fill="url(#aurora-2-light)"/>

    <!-- Crisp aurora ribbon curves -->
    <path d="M -20 225 C 210 140, 420 275, 650 185 C 860 105, 1020 220, 1220 155"
          fill="none" stroke="url(#aurora-stroke-light)" stroke-width="1.8"/>
    <path d="M -20 250 C 260 180, 490 285, 760 205 C 950 148, 1070 245, 1220 205"
          fill="none" stroke="#5E81AC" stroke-opacity="0.32" stroke-width="1.1"/>

    <!-- Geometric Nordic corner brackets -->
    <g stroke="#5E81AC" stroke-opacity="0.45" stroke-width="1.4" fill="none">
      <path d="M 32 50 L 32 32 L 50 32"/>
      <path d="M 1150 32 L 1168 32 L 1168 50"/>
      <path d="M 32 250 L 32 268 L 50 268"/>
      <path d="M 1150 268 L 1168 268 L 1168 250"/>
    </g>

    <!-- Subtle coordinate crosshairs -->
    <g stroke="#5E81AC" stroke-opacity="0.35" stroke-width="1">
      <line x1="156" y1="80" x2="164" y2="80"/>
      <line x1="160" y1="76" x2="160" y2="84"/>
      <line x1="1036" y1="80" x2="1044" y2="80"/>
      <line x1="1040" y1="76" x2="1040" y2="84"/>
    </g>

    <!-- Nord palette swatch dots -->
    <g transform="translate(1062, 42)">
      <circle cx="0" cy="0" r="3.5" fill="#8FBCBB"/>
      <circle cx="14" cy="0" r="3.5" fill="#88C0D0"/>
      <circle cx="28" cy="0" r="3.5" fill="#81A1C1"/>
      <circle cx="42" cy="0" r="3.5" fill="#5E81AC"/>
      <circle cx="56" cy="0" r="3.5" fill="#B48EAD"/>
    </g>

    <!-- Top-left handle tag -->
    <text x="64" y="47" class="mono" fill="#5E81AC" opacity="0.9">@yunbuucuu // NORD</text>

    <!-- Center Status Pill -->
    <g transform="translate(454, 62)">
      <rect x="0" y="0" width="292" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.78" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="22" cy="14" r="4" fill="#7D9B6A" class="dot-pulse"/>
      <text x="36" y="18.5" class="mono" fill="#3B4252">Meta-Learning · Open to Work</text>
    </g>

    <!-- Main Hero Title -->
    <text x="600" y="156" text-anchor="middle" class="title" fill="url(#title-grad-light)">code is everything</text>

    <!-- Subtle accent bar under title -->
    <rect x="540" y="176" width="120" height="2.5" rx="1.25" fill="url(#aurora-stroke-light)"/>

    <!-- Chinese Subtitle -->
    <text x="600" y="216" text-anchor="middle" class="subtitle" fill="#434C5E">研三学生 · 元学习（Meta-Learning）方向 · 正在寻找工作机会</text>
  </g>

  <!-- Subtle outer frame -->
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#D8DEE9" stroke-width="1.5"/>
</svg>
