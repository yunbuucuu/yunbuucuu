<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Sketch black cat lounging and watching yarn ball divider 3 (Dark)">
  <defs>
    <filter id="sketch-d3" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="37" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ===== Relaxed Wavy Yarn Trail Right -> Left ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1018 88 C 915 80, 820 94, 708 86 C 590 78, 470 94, 345 84 C 245 76, 175 90, 98 84"
          stroke="#A3A3A3" stroke-width="1.3" stroke-dasharray="16 6 26 6" opacity="0.65"/>
    <path d="M 1020 85 C 916 76, 822 92, 710 83 C 592 74, 472 91, 346 81 C 246 73, 176 87, 96 81"
          stroke="#F5F5F5" stroke-width="2.4" filter="url(#sketch-d3)"/>
    <!-- Gentle resting coil in middle -->
    <path d="M 526 83 C 516 66, 542 66, 536 83" stroke="#F5F5F5" stroke-width="2"/>
    <!-- Tiny sleepy/calm doodle sparks above lounging cat -->
    <text x="1032" y="28" fill="#D4D4D4" font-family="Consolas, monospace" font-size="13" font-weight="700" opacity="0.75">...</text>
  </g>

  <!-- ===== Settled Hand-Drawn Textured Yarn Ball (Far Left) ===== -->
  <g transform="translate(72, 74)">
    <!-- Loose curled yarn end resting on left -->
    <path d="M -24 8 C -36 14, -46 8, -42 0 C -39 -6, -31 -2, -35 4" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="23" fill="#141414" stroke="#FFFFFF" stroke-width="2.4" filter="url(#sketch-d3)"/>
    <circle cx="1" cy="1" r="24.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55" stroke-dasharray="18 6 10 5"/>
    <g fill="none" stroke="#F5F5F5" stroke-width="1.7" stroke-linecap="round" opacity="0.92">
      <path d="M -18 -9 C -5 -19, 11 -15, 19 -3"/>
      <path d="M -21 3 C -7 -9, 10 -5, 21 7"/>
      <path d="M -15 14 C -2 5, 11 9, 17 14"/>
      <path d="M -11 -18 C -2 -5, -8 10, -14 17"/>
      <path d="M 4 -21 C 12 -7, 6 10, -2 21"/>
    </g>
  </g>

  <!-- ===== Pose 3: Lounging / Loafing Deadpan Black Cat Watching Ball (Right End) ===== -->
  <g transform="translate(1018, 22)">
    <!-- Curled lazy tail on far right -->
    <path d="M 144 68 C 166 68, 172 50, 158 44 C 148 40, 142 50, 150 54" fill="none" stroke="#050505" stroke-width="6" stroke-linecap="round"/>
    <path d="M 144 68 C 166 68, 172 50, 158 44 C 148 40, 142 50, 150 54" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Messy white chalk outer double outline -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 70 C 0 68, 2 60, 14 60 L 34 60 C 28 52, 28 40, 34 30 L 38 14 L 52 28 L 66 28 L 78 14 L 82 30 C 102 28, 128 32, 142 46 C 150 54, 150 66, 144 72 L 10 72 Z"
            stroke-width="3.6" opacity="0.95" filter="url(#sketch-d3)"/>
      <path d="M 2 72 C -4 68, -1 57, 13 57 L 31 57 C 25 49, 25 38, 31 27 L 36 10 L 52 25 L 66 25 L 80 10 L 85 27 C 106 25, 132 29, 146 44 C 154 53, 154 67, 147 74"
            stroke-width="1.4" opacity="0.72"/>
      <!-- Whiskers -->
      <path d="M 32 46 L 12 42 M 32 50 L 10 50 M 34 54 L 14 56" stroke-width="1.6" opacity="0.9"/>
      <path d="M 86 46 L 104 43 M 86 50 L 106 50" stroke-width="1.5" opacity="0.82"/>
    </g>

    <!-- Solid Pitch-Black Lounging Cat Silhouette -->
    <path d="M 6 70 C 0 68, 2 60, 14 60 L 34 60 C 28 52, 28 40, 34 30 L 38 14 L 52 28 L 66 28 L 78 14 L 82 30 C 102 28, 128 32, 142 46 C 150 54, 150 66, 144 72 L 10 72 Z"
          fill="#050505"/>

    <!-- Iconic Half-Lidded Deadpan White Eyes (calmly gazing left) -->
    <path d="M 39 42 L 54 41 C 54 48, 51 51, 46.5 51 C 42 51, 39 48, 39 42 Z" fill="#FFFFFF"/>
    <path d="M 41 42 L 45.5 41.8 L 45.5 47.5 C 45.5 49, 44.3 49.8, 43.2 49.8 C 42.1 49.8, 41 49, 41 47.5 Z" fill="#050505"/>

    <path d="M 62 41 L 77 42 C 77 48, 74 51, 69.5 51 C 65 51, 62 48, 62 41 Z" fill="#FFFFFF"/>
    <path d="M 64 41.5 L 68.5 41.8 L 68.5 47.5 C 68.5 49, 67.3 49.8, 66.2 49.8 C 65.1 49.8, 64 49, 64 47.5 Z" fill="#050505"/>

    <ellipse cx="57" cy="52" rx="2.1" ry="1" fill="#FFFFFF"/>
  </g>
</svg>
