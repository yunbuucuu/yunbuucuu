name: Generate Nord Contribution Snake

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动更新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Nord Dark & Light Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#88c0d0&color_dots=#2e3440,#3b4252,#4c566a,#5e81ac,#88c0d0
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#5e81ac&color_dots=#eceff4,#d8dee9,#81a1c1,#5e81ac,#3b4252

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
