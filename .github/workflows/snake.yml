name: Generate Monochrome Contribution Snake

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动更新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Monochrome Dark & Light Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161616,#2f2f2f,#5c5c5c,#9a9a9a,#ffffff
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#111111&color_dots=#ebebeb,#cfcfcf,#969696,#525252,#111111

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
